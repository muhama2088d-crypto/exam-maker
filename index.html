<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صانع الأسئلة الامتحانية | تبسيط التقنية</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root { --primary: #1976d2; --bg: #f4f6f9; --card-bg: #ffffff; --border: #dcdfe6; }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; padding: 16px; background-color: var(--bg); color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: var(--card-bg); padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    h2, h3 { margin-top: 0; color: #2c3e50; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #555; }
    input[type="text"], textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
    .question-block { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    .btn { display: inline-block; padding: 10px 16px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: #2e7d32; color: #fff; }
    .btn-danger { background: #e53935; color: #fff; padding: 6px 10px; font-size: 12px; }
    .btn-warning { background: #f39c12; color: #fff; }
    .toolbar-btn { background: #eee; border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; margin-left: 4px; margin-bottom: 4px; }
    .actions-bar { display: flex; gap: 8px; margin-top: 16px; }
    
    #paper-preview { 
      display: none; background: #fff; color: #000;
      border: 3px solid #000; outline: 1px solid #000; outline-offset: -8px;
      padding: 30px; margin: 20px auto; direction: rtl; text-align: right; flex-direction: column; position: relative; overflow: hidden;
    }
    
    .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg); font-size: 80px; color: rgba(0,0,0,0.06); white-space: nowrap; pointer-events: none; z-index: 0; font-weight: bold; display: none; }
    .exam-table { width: 100%; border-collapse: collapse; margin-top: 20px; z-index: 1; position: relative; }
    .exam-table th, .exam-table td { border: 2px solid #000; padding: 15px; font-size: 16px; font-weight: bold; vertical-align: top; }
    
    .size-A4 { width: 210mm; min-height: 297mm; }
    .size-A5 { width: 148mm; min-height: 210mm; font-size: 90%; }
    
    @media print {
      @page { margin: 0; } 
      body { background-color: #fff; padding: 0; margin: 0; display: flex; justify-content: center; }
      body * { visibility: hidden; }
      #editor-ui { display: none !important; }
      #paper-preview, #paper-preview * { visibility: visible; }
      #paper-preview { display: flex !important; position: absolute; left: 0; top: 0; margin: 0 !important; transform-origin: top center; border: none; outline: none; }
      .size-A4 { width: 210mm; min-height: 295mm; }
      .size-A5 { width: 148mm; min-height: 208mm; }
    }
    
    .paper-header { border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-start; font-size: 15px; font-weight: bold; line-height: 1.6; z-index: 1; position: relative; direction: rtl; }
    .header-right { text-align: right; flex: 1; }
    .header-center { text-align: center; flex: 1.5; }
    .header-left { text-align: left; flex: 1; }
    .exam-type-title { font-size: 22px; text-decoration: underline; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="editor-ui">
        <h2>📝 صانع الأسئلة الامتحانية (التحديث الذهبي)</h2>
        
        <div class="card">
          <h3>إعدادات الورقة والمادة</h3>
          <div class="grid">
            <div class="form-group">
              <label>حجم الورقة</label>
              <select id="paperSize">
                <option value="A4">A4 - ورقة كاملة</option>
                <option value="A5">A5 - نصف ورقة</option>
              </select>
            </div>
            <div class="form-group">
              <label>تخصيص المادة</label>
              <select id="subjectType" onchange="toggleMathToolbar()">
                <option value="arabic">عربي ومواد عامة</option>
                <option value="english">اللغة الإنكليزية (من اليسار لليمين)</option>
                <option value="math">الرياضيات (إظهار الرموز)</option>
              </select>
            </div>
            <div class="form-group">
              <label>نمط الأسئلة</label>
              <select id="paperMode" onchange="toggleAnswerFields()">
                <option value="standard">نمط اعتيادي</option>
                <option value="table">نمط جدول (سؤال وجواب - ابتدائي)</option>
              </select>
            </div>
            <!-- حقل اختيار الألوان المخفي افتراضياً -->
            <div class="form-group" id="table-colors-group" style="display: none;">
              <label>ألوان الجدول (اختياري)</label>
              <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                  <span style="font-size: 11px; display: block; margin-bottom: 2px; color: #666;">عمود السؤال</span>
                  <input type="color" id="qColor" value="#ffffff" style="padding: 0; height: 38px; cursor: pointer; border: none; border-radius: 4px; width: 100%;">
                </div>
                <div style="flex: 1;">
                  <span style="font-size: 11px; display: block; margin-bottom: 2px; color: #666;">عمود الجواب</span>
                  <input type="color" id="aColor" value="#ffffff" style="padding: 0; height: 38px; cursor: pointer; border: none; border-radius: 4px; width: 100%;">
                </div>
              </div>
            </div>
            <div class="form-group">
              <label>العلامة المائية (اختياري)</label>
              <input type="text" id="watermarkText" placeholder="اكتب اسمك لحفظ الحقوق">
            </div>
          </div>
        </div>
        
        <div class="card">
          <h3>بيانات الامتحان (الترويسة والختام)</h3>
          <div class="grid">
            <div class="form-group"><label>إظهار البسملة</label><select id="basmala"><option value="yes">نعم</option><option value="no">لا</option></select></div>
            <div class="form-group"><label>المديرية (اختياري)</label><input type="text" id="directorate" placeholder="المديرية العامة لتربية..."></div>
            <div class="form-group"><label>اسم المدرسة</label><input type="text" id="school" placeholder="مدرسة الأمل"></div>
            <div class="form-group"><label>نوع الامتحان</label><input type="text" id="examType" placeholder="امتحانات الشهر الأول"></div>
            <div class="form-group"><label>المادة</label><input type="text" id="subject" placeholder="العلوم"></div>
            <div class="form-group"><label>الصف والشعبة</label><input type="text" id="grade" placeholder="الخامس الابتدائي"></div>
            <div class="form-group"><label>العام الدراسي</label><input type="text" id="year" placeholder="2026/2027"></div>
            <div class="form-group"><label>التاريخ</label><input type="text" id="examDate" placeholder="2026/11/1"></div>
            <div class="form-group"><label>الوقت</label><input type="text" id="examTime" placeholder="ساعة ونصف"></div>
            <div class="form-group">
              <label>اللقب (أسفل الورقة)</label>
              <select id="teacherTitle">
                <option value="معلم المادة">معلم المادة</option>
                <option value="معلمة المادة">معلمة المادة</option>
                <option value="مدرس المادة">مدرس المادة</option>
                <option value="مدرسة المادة">مدرسة المادة</option>
              </select>
            </div>
            <div class="form-group"><label>اسم الأستاذ</label><input type="text" id="teacherName" placeholder="الاسم والتوقيع"></div>
            <div class="form-group"><label>الملاحظة السفلية</label><input type="text" id="examNote" placeholder="تمنياتنا لكم بالنجاح"></div>
          </div>
        </div>
        
        <div class="card">
          <h3>الأسئلة</h3>
          <div id="math-toolbar" style="display: none; margin-bottom: 10px; background: #eee; padding: 10px; border-radius: 8px;">
            <strong>أدوات الرياضيات: </strong>
            <button type="button" class="toolbar-btn" onclick="insertSymGlobal('²')">x²</button>
            <button type="button" class="toolbar-btn" onclick="insertSymGlobal('³')">x³</button>
            <button type="button" class="toolbar-btn" onclick="insertSymGlobal('π')">π</button>
            <button type="button" class="toolbar-btn" onclick="insertSymGlobal('°')">°</button>
            <button type="button" class="toolbar-btn" onclick="insertSymGlobal('≈')">≈</button>
          </div>
          <div id="q-container"></div>
          <button class="btn btn-primary" onclick="addQ()">➕ إضافة سؤال جديد</button>
        </div>
        
        <div class="actions-bar">
          <button class="btn btn-success" style="flex:1; font-size: 16px;" onclick="printPaper()">🖨 معاينة وطباعة PDF</button>
          <button class="btn btn-warning" style="flex:1; font-size: 16px;" onclick="saveImage()">🖼 حفظ كصورة</button>
        </div>
    </div>
    
    <div id="paper-preview" class="size-A4">
      <div id="pv-watermark" class="watermark"></div>
      <div style="position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100%;">
          <div id="pv-basmala" style="text-align: center; font-weight: bold; font-size: 16px; margin-bottom: 5px; display: none; direction: rtl;">بسم الله الرحمن الرحيم</div>
          <div class="paper-header">
            <div class="header-right">
              جمهورية العراق<br>وزارة التربية<br>
              <span id="pv-directorate" style="display:none;"></span><br id="pv-dir-br" style="display:none;">
              المدرسة: <span id="pv-school"></span>
            </div>
            <div class="header-center">
              <div class="exam-type-title" id="pv-type"></div>
              للعام الدراسي <span id="pv-year"></span><br>
              الصف: <span id="pv-grade"></span>
            </div>
            <div class="header-left">
              المادة: <span id="pv-subject"></span><br>
              التاريخ: <span id="pv-date"></span><br>
              الوقت: <span id="pv-time"></span>
            </div>
          </div>
          
          <!-- منطقة الأسئلة -->
          <div id="pv-qs" style="flex-grow: 1;"></div>
          
          <div style="margin-top: 30px; display: flex; justify-content: space-between; align-items: flex-end; font-weight: bold; font-size: 16px; direction: rtl;">
            <div style="text-align: right; width: 30%;">
              <div id="pv-teacher-title"></div>
              <div id="pv-teacher-name" style="margin-top: 5px;"></div>
            </div>
            <div style="text-align: left; width: 70%;">
              <span id="pv-note"></span>
            </div>
          </div>
      </div>
    </div>
  </div>
  
  <script>
    let count = 0;
    let activeInput = null;
    
    document.addEventListener('focusin', function(e) {
      if(e.target.tagName === 'TEXTAREA' || (e.target.tagName === 'INPUT' && e.target.type === 'text')) {
        activeInput = e.target;
      }
    });

    function toggleMathToolbar() {
      let type = document.getElementById('subjectType').value;
      document.getElementById('math-toolbar').style.display = (type === 'math') ? 'block' : 'none';
      
      let mathBtns = document.querySelectorAll('.math-btn');
      mathBtns.forEach(btn => {
        btn.style.display = (type === 'math') ? 'inline-block' : 'none';
      });
    }

    function toggleAnswerFields() {
      let mode = document.getElementById('paperMode').value;
      let ansFields = document.querySelectorAll('.q-answer');
      
      // إظهار وإخفاء حقول الإجابة داخل الأسئلة
      ansFields.forEach(field => {
        field.style.display = (mode === 'table') ? 'block' : 'none';
      });
      
      // إظهار وإخفاء خيارات الألوان الخاصة بالجدول
      document.getElementById('table-colors-group').style.display = (mode === 'table') ? 'block' : 'none';
    }

    function addQ() {
      count++;
      let currentType = document.getElementById('subjectType').value;
      let mathDisplay = (currentType === 'math') ? 'inline-block' : 'none';
      
      let currentMode = document.getElementById('paperMode').value;
      let ansDisplay = (currentMode === 'table') ? 'block' : 'none';
      
      let div = document.createElement('div');
      div.className = 'question-block';
      div.innerHTML = "<div style='display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center;'>" +
        "<div style='flex:1; display:flex; align-items:center;'>" +
          "<strong style='margin-left: 10px;'>س" + count + "</strong>" +
          "<input type='text' class='q-title' placeholder='صيغة السؤال (مثال: أجب عن فرعين)' style='width: 70%; padding: 6px; font-size: 13px; border-color: red; color: red;'>" +
        "</div>" +
        "<button type='button' class='btn btn-danger' onclick='this.parentElement.parentElement.remove()'>حذف</button>" +
      "</div>" +
      "<div style='margin-bottom: 8px;'>" +
        "<button type='button' class='toolbar-btn' onmousedown='event.preventDefault(); insertSym(this, \" .................... \")'>➕ فراغ</button>" +
        "<button type='button' class='toolbar-btn math-btn' style='display: " + mathDisplay + ";' onmousedown='event.preventDefault(); insertSym(this, \" ÷ \")'>÷</button>" +
        "<button type='button' class='toolbar-btn math-btn' style='display: " + mathDisplay + ";' onmousedown='event.preventDefault(); insertSym(this, \" × \")'>×</button>" +
        "<button type='button' class='toolbar-btn math-btn' style='display: " + mathDisplay + ";' onmousedown='event.preventDefault(); insertSym(this, \" √ \")'>√</button>" +
      "</div>" +
      "<textarea rows='2' class='q-text' placeholder='نص السؤال (يكتب هنا)'></textarea>" +
      "<textarea rows='2' class='q-answer' placeholder='اكتب الجواب هنا (يظهر في الجدول فقط)' style='display: " + ansDisplay + "; margin-top: 5px; border: 1px solid #2ecc71; background-color: #f4fdf7;'></textarea>" +
      "<div class='branches-container'></div>" +
      "<div style='margin-top: 8px; text-align: right;'>" +
        "<button type='button' class='btn' style='background: #e0e0e0; color: #333; padding: 6px 12px; font-size: 12px; border: 1px solid #ccc;' onclick='addBranch(this)'>" + 
        "➕ إضافة فرع (أ، ب، ج)" + 
        "</button>" +
      "</div>";
      document.getElementById('q-container').appendChild(div);
    }
    
    function addBranch(btn) {
      let container = btn.parentElement.previousElementSibling;
      let branchCount = container.children.length;
      let alphabet = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي'];
      let currentLetter = alphabet[branchCount] || '-';
      
      let branchDiv = document.createElement('div');
      branchDiv.className = 'b-block';
      branchDiv.style.marginTop = '10px';
      branchDiv.style.padding = '10px';
      branchDiv.style.border = '1px dashed #aaa';
      branchDiv.style.borderRadius = '6px';
      branchDiv.style.backgroundColor = '#f0f4f8';
      
      branchDiv.innerHTML = "<div style='display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center;'>" +
        "<div style='flex:1; display:flex; align-items:center;'>" +
          "<strong class='b-label' style='margin-left: 10px;'>فرع (" + currentLetter + ")</strong>" +
          "<input type='text' class='b-title' placeholder='صيغة الفرع (مثال: علل ما يأتي)' style='width: 70%; padding: 6px; font-size: 13px; border-color: red; color: red;'>" +
        "</div>" +
        "<button type='button' class='btn btn-danger' style='padding: 4px 8px; font-size: 12px;' onclick='this.parentElement.parentElement.remove(); updateBranches(this.closest(\".branches-container\"));'>حذف</button>" +
      "</div>" +
      "<textarea rows='2' class='b-text' placeholder='اكتب نص الفرع هنا...' style='width: 100%; padding: 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;'></textarea>";
      
      container.appendChild(branchDiv);
    }
    
    function updateBranches(container) {
      let alphabet = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي'];
      let blocks = container.querySelectorAll('.b-block');
      blocks.forEach((block, index) => {
        let label = block.querySelector('.b-label');
        if(label) label.innerText = 'فرع (' + alphabet[index] + ')';
      });
    }
    
    function insertSym(btn, sym) {
      let qBlock = btn.closest('.question-block');
      let ta = (activeInput && qBlock.contains(activeInput)) ? activeInput : qBlock.querySelector('.q-text');
      let s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
      ta.value = v.substring(0, s) + sym + v.substring(e);
      ta.focus(); ta.selectionEnd = s + sym.length;
    }

    function insertSymGlobal(sym) {
      if(activeInput) {
        let s = activeInput.selectionStart, e = activeInput.selectionEnd, v = activeInput.value;
        activeInput.value = v.substring(0, s) + sym + v.substring(e);
        activeInput.focus(); activeInput.selectionEnd = s + sym.length;
      }
    }
    
    function preparePaper() {
      let pSize = document.getElementById('paperSize').value;
      let subjectType = document.getElementById('subjectType').value;
      let paperMode = document.getElementById('paperMode').value;
      let preview = document.getElementById('paper-preview');
      let isEnglish = (subjectType === 'english');
      
      preview.className = 'size-' + pSize;
      
      let qsContainer = document.getElementById('pv-qs');
      qsContainer.style.direction = isEnglish ? 'ltr' : 'rtl';
      qsContainer.style.textAlign = isEnglish ? 'left' : 'right';

      document.getElementById('pv-basmala').style.display = (document.getElementById('basmala').value === 'yes') ? 'block' : 'none';
      
      let dirVal = document.getElementById('directorate').value;
      if(dirVal) {
          document.getElementById('pv-directorate').style.display = 'inline';
          document.getElementById('pv-directorate').innerText = dirVal;
          document.getElementById('pv-dir-br').style.display = 'inline';
      } else {
          document.getElementById('pv-directorate').style.display = 'none';
          document.getElementById('pv-dir-br').style.display = 'none';
      }

      let watermarkText = document.getElementById('watermarkText').value;
      let watermarkElem = document.getElementById('pv-watermark');
      if(watermarkText) { watermarkElem.style.display = 'block'; watermarkElem.innerText = watermarkText; } 
      else { watermarkElem.style.display = 'none'; }

      document.getElementById('pv-school').innerText = document.getElementById('school').value;
      document.getElementById('pv-type').innerText = document.getElementById('examType').value;
      document.getElementById('pv-subject').innerText = document.getElementById('subject').value;
      document.getElementById('pv-grade').innerText = document.getElementById('grade').value;
      document.getElementById('pv-year').innerText = document.getElementById('year').value;
      document.getElementById('pv-date').innerText = document.getElementById('examDate').value;
      document.getElementById('pv-time').innerText = document.getElementById('examTime').value;
      document.getElementById('pv-teacher-title').innerText = document.getElementById('teacherTitle').value;
      document.getElementById('pv-teacher-name').innerText = document.getElementById('teacherName').value;
      document.getElementById('pv-note').innerText = document.getElementById('examNote').value;
      
      let pq = document.getElementById('pv-qs');
      pq.innerHTML = "";
      
      let blocks = document.querySelectorAll('.question-block');
      let validBlocks = Array.from(blocks).filter(b => b.querySelector('.q-text').value.trim() !== "" || b.querySelector('.q-title').value.trim() !== "" || (b.querySelector('.q-answer') && b.querySelector('.q-answer').value.trim() !== "") || b.querySelectorAll('.b-block').length > 0);
      
      let alphabet = isEnglish ? ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'] : ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي'];
      let padSide = isEnglish ? "padding-left" : "padding-right";

      if(paperMode === 'table') {
         // قراءة الألوان التي اختارها المستخدم
         let qColor = document.getElementById('qColor').value;
         let aColor = document.getElementById('aColor').value;

         let thQ = isEnglish ? "Question" : "السؤال";
         let thA = isEnglish ? "Answer" : "الجواب";
         
         // تطبيق الألوان على العناوين
         let tableHTML = "<table class='exam-table'><tr><th style='width: 50%; text-align: center; background-color: " + qColor + ";'>" + thQ + "</th><th style='width: 50%; text-align: center; background-color: " + aColor + ";'>" + thA + "</th></tr>";
         
         validBlocks.forEach((b, i) => {
            let qTitle = b.querySelector('.q-title').value.trim();
            let qText = b.querySelector('.q-text').value.replace(/\n/g, '<br>');
            let qAnswer = b.querySelector('.q-answer') ? b.querySelector('.q-answer').value.replace(/\n/g, '<br>') : "";
            let qLabel = isEnglish ? "Q" + (i+1) + ". " : "س" + (i+1) + ": ";
            
            // تطبيق الألوان على الحقول الداخلية
            tableHTML += "<tr><td style='background-color: " + qColor + ";'><strong>" + qLabel + "</strong>" + (qTitle ? "<span style='color:red; margin: 0 5px;'>"+qTitle+"</span><br>" : "") + qText + "</td><td style='background-color: " + aColor + ";'>" + qAnswer + "</td></tr>";
         });
         tableHTML += "</table>";
         pq.innerHTML = tableHTML;
      } else {
          validBlocks.forEach((b, i) => {
            let qTitle = b.querySelector('.q-title').value.trim();
            let qText = b.querySelector('.q-text').value.replace(/\n/g, '<br>');
            let qNum = (i+1).toString();
            let qLabel = isEnglish ? "Q" + qNum + ". " : "س" + qNum + ": ";
            
            let borderStyle = (i === validBlocks.length - 1) ? "border-bottom: none;" : "border-bottom: 2px dashed #666;";
            let titleHtml = qTitle ? "<span style='color: red; margin: 0 8px; font-size: 16px;'>" + qTitle + "</span>" : "";
            let mainTextHtml = qText ? "<div style='font-size: 16px; line-height: 1.5; " + padSide + ": 15px; margin-top: 4px;'>" + qText + "</div>" : "";
            
            let branchesHtml = "";
            let bBlocks = b.querySelectorAll('.b-block');
            let bIndex = 0;
            
            bBlocks.forEach(bb => {
              let bTitleVal = bb.querySelector('.b-title').value.trim();
              let bTextVal = bb.querySelector('.b-text').value.replace(/\n/g, '<br>');
              
              if(bTitleVal !== "" || bTextVal.trim() !== "") {
                let bTitleHtml = bTitleVal ? "<span style='color: red; margin: 0 8px; font-size: 16px;'>" + bTitleVal + "</span>" : "";
                let branchLabel = isEnglish ? alphabet[bIndex] + ") " : alphabet[bIndex] + " / ";
                
                branchesHtml += "<div style='margin-top: 12px; " + padSide + ": 20px; font-size: 16px;'>" +
                  "<div style='margin-bottom: 4px;'><strong>" + branchLabel + "</strong>" + bTitleHtml + "</div>" +
                  "<div style='" + padSide + ": 25px; line-height: 1.5;'>" + bTextVal + "</div>" +
                "</div>";
                bIndex++;
              }
            });
            
            pq.innerHTML += "<div style='margin-bottom: 15px; padding-bottom: 15px; " + borderStyle + "'>" +
              "<div style='margin-bottom: 8px;'><strong style='font-size: 18px;'>" + qLabel + "</strong> " + titleHtml + "</div>" +
              mainTextHtml + branchesHtml +
            "</div>";
          });
      }
    }

    function printPaper() {
      preparePaper();
      document.getElementById('paper-preview').style.display = 'flex';
      window.print();
      document.getElementById('paper-preview').style.display = 'none';
    }
    
    function saveImage() {
      preparePaper();
      let editor = document.getElementById('editor-ui');
      let preview = document.getElementById('paper-preview');
      
      editor.style.display = 'none';
      preview.style.display = 'flex';
      
      setTimeout(() => {
        html2canvas(preview, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
          let link = document.createElement('a');
          link.download = 'الأسئلة_الامتحانية.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          
          editor.style.display = 'block';
          preview.style.display = 'none';
        });
      }, 300);
    }

    addQ();
  </script>
</body>
</html>
