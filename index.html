<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صانع الأسئلة السريع</title>
  <style>
    :root { --primary: #1976d2; --bg: #f4f6f9; --card-bg: #ffffff; --border: #dcdfe6; }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background-color: var(--bg); color: #333; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: var(--card-bg); padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    h2, h3 { margin-top: 0; color: #2c3e50; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #555; }
    input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
    .question-block { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    .btn { display: inline-block; padding: 10px 16px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: #2e7d32; color: #fff; }
    .btn-danger { background: #e53935; color: #fff; padding: 6px 10px; font-size: 12px; }
    .toolbar-btn { background: #eee; border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; margin-left: 4px; margin-bottom: 4px; }
    .actions-bar { display: flex; gap: 8px; margin-top: 16px; }
    #paper-preview { display: none; background: #fff; padding: 24px; border: 2px solid #333; border-radius: 4px; margin-top: 20px; }
    .paper-header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 16px; display: flex; justify-content: space-between; font-size: 13px; }
    .exam-title { font-size: 16px; font-weight: bold; text-decoration: underline; }
    @media print {
      body * { visibility: hidden; }
      #paper-preview, #paper-preview * { visibility: visible; }
      #paper-preview { display: block !important; position: absolute; left: 0; top: 0; width: 100%; border: none; padding: 0; }
      .actions-bar, .card, h2 { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📝 صانع الأسئلة الامتحانية</h2>
    <div class="card">
      <h3>بيانات الامتحان (الترويسة)</h3>
      <div class="grid">
        <div class="form-group"><label>اسم المدرسة</label><input type="text" id="school" placeholder="مدرسة الأمل"></div>
        <div class="form-group"><label>المادة</label><input type="text" id="subject" placeholder="الرياضيات"></div>
        <div class="form-group"><label>الصف والشعبة</label><input type="text" id="grade" placeholder="الخامس الابتدائي"></div>
        <div class="form-group"><label>العام الدراسي</label><input type="text" id="year" placeholder="2026/2027"></div>
        <div class="form-group"><label>الوقت</label><input type="text" id="examTime" placeholder="ساعتان"></div>
      </div>
    </div>
    <div class="card">
      <h3>الأسئلة</h3>
      <div id="q-container"></div>
      <button class="btn btn-primary" onclick="addQ()">➕ إضافة سؤال جديد</button>
    </div>
    <div class="actions-bar">
      <button class="btn btn-success" style="flex:1;" onclick="printPaper()">🖨️ طباعة أو حفظ PDF</button>
    </div>
    <div id="paper-preview">
      <div class="paper-header">
        <div style="text-align: right;">جمهورية العراق<br>وزارة التربية<br><span id="pv-school"></span></div>
        <div style="text-align: center;"><div class="exam-title">أسئلة الامتحانات</div><span id="pv-year"></span><br><span id="pv-grade"></span></div>
        <div style="text-align: left;"><span id="pv-subject"></span><br><span id="pv-time"></span><br>ملاحظة: أجب عن جميع الأسئلة</div>
      </div>
      <div id="pv-qs"></div>
    </div>
  </div>
  <script>
    let count = 0;
    function addQ() {
      count++;
      let div = document.createElement('div');
      div.className = 'question-block';
      div.innerHTML = `<strong>س${count}</strong> 
      <button class="btn btn-danger" onclick="this.parentElement.remove()">حذف</button><br><br>
      <button type="button" class="toolbar-btn" onclick="insertSym(this, ' .................... ')">➕ فراغ</button>
      <button type="button" class="toolbar-btn" onclick="insertSym(this, ' ÷ ')">÷</button>
      <button type="button" class="toolbar-btn" onclick="insertSym(this, ' × ')">×</button>
      <button type="button" class="toolbar-btn" onclick="insertSym(this, ' √ ')">√</button><br>
      <textarea rows="2" class="q-text" placeholder="اكتب السؤال هنا..."></textarea>`;
      document.getElementById('q-container').appendChild(div);
    }
    function insertSym(btn, sym) {
      let ta = btn.parentElement.querySelector('.q-text');
      let s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
      ta.value = v.substring(0, s) + sym + v.substring(e);
      ta.focus();
      ta.selectionEnd = s + sym.length;
    }
    function printPaper() {
      document.getElementById('pv-school').innerText = "المدرسة: " + document.getElementById('school').value;
      document.getElementById('pv-subject').innerText = "المادة: " + document.getElementById('subject').value;
      document.getElementById('pv-grade').innerText = "الصف: " + document.getElementById('grade').value;
      document.getElementById('pv-year').innerText = document.getElementById('year').value;
      document.getElementById('pv-time').innerText = "الوقت: " + document.getElementById('examTime').value;
      let pq = document.getElementById('pv-qs');
      pq.innerHTML = "";
      let texts = document.querySelectorAll('.q-text');
      texts.forEach((t, i) => {
        if(t.value.trim() !== "") pq.innerHTML += `<p style="margin-bottom: 14px; font-size: 15px;"><strong>س\({i+1}: </strong>\){t.value}</p>`;
      });
      document.getElementById('paper-preview').style.display = 'block';
      window.print();
    }
    addQ();
  </script>
</body>
</html>
