<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صانع الأسئلة الامتحانية</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root { --primary: #1976d2; --bg: #f4f6f9; --card-bg: #ffffff; --border: #dcdfe6; }
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { margin: 0; padding: 16px; background: var(--bg); color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: var(--card-bg); padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    h2, h3 { margin-top: 0; color: #2c3e50; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #555; }
    input[type="text"], textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
    .question-block { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    .btn { display: inline-block; padding: 10px 16px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: #2e7d32; color: #fff; }
    .btn-danger { background: #e53935; color: #fff; padding: 6px 10px; font-size: 12px; }
    .btn-warning { background: #f39c12; color: #fff; }
    .btn-purple { background: #8e44ad; color: #fff; }
    .toolbar-btn { background: #eee; border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; margin-left: 4px; margin-bottom: 4px; }
    .actions-bar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    #paper-preview { display: none; margin: 20px auto; }
    #paper-preview.single, #paper-preview.duo { flex-direction: column; width: 210mm; }
    .sheet { position: relative; overflow: hidden; display: flex; flex-direction: column; direction: rtl; text-align: right; }
    .sheet-A4 { width: 210mm; min-height: 297mm; padding: 30px; }
    .sheet-A5 { width: 210mm; height: 147.5mm; padding: 14px; }
    .sheet-inner { position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1; }
    .sheet-footer { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: flex-end; font-weight: bold; }
    .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; color: rgba(0,0,0,0.06); white-space: nowrap; pointer-events: none; display: none; align-items: center; justify-content: center; width: 100%; height: 100%; }
    .exam-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .exam-table th, .exam-table td { border: 2px solid currentColor; padding: 15px; font-weight: bold; vertical-align: top; }
    @media print {
      @page { margin: 0; }
      body { background: #fff; padding: 0; margin: 0; }
      body * { visibility: hidden; }
      #editor-ui, #updateBanner, #toast { display: none !important; }
      #paper-preview, #paper-preview * { visibility: visible; }
      #paper-preview { display: flex !important; position: absolute !important; right: 0; top: 0; left: auto; margin: 0 !important; }
      #paper-preview.duo, #paper-preview.single { width: 210mm; }
      .sheet-A4 { min-height: 295mm; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
    .paper-header { border-bottom: 2px solid currentColor; padding-bottom: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-start; font-weight: bold; line-height: 1.6; z-index: 1; }
    .header-right { text-align: right; flex: 1; }
    .header-center { text-align: center; flex: 1.5; }
    .header-left { text-align: left; flex: 1; }
    .exam-type-title { font-size: 1.3em; text-decoration: underline; margin-bottom: 6px; }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #2e7d32; color: white; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    #updateBanner { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #1976d2; color: white; padding: 12px; text-align: center; font-weight: bold; z-index: 10000; }
    #updateBanner button { background: white; color: #1976d2; border: none; padding: 8px 16px; border-radius: 6px; margin-right: 10px; font-weight: bold; cursor: pointer; }
    @media (max-width: 768px) {
      .container { padding: 0; }
      body { padding: 8px; }
      #paper-preview { transform: scale(0.4); transform-origin: top center; margin-bottom: -150mm !important; }
    }
    .math-sqrt { display: inline-flex; align-items: center; position: relative; direction: ltr; margin: 0 4px; vertical-align: middle; }
    .math-sqrt svg { height: 1.4em; width: auto; }
    .math-sqrt .sqrt-inner { font-size: 1em; padding-top: 0.1em; }
  </style>
</head>
<body>
  <div class="container">
    <div id="editor-ui">
      <h2 style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        📝 صانع الأسئلة الامتحانية
        <div style="display: flex; gap: 8px;">
          <button id="installBtn" class="btn" style="background: #e74c3c; color: white; display: none; padding: 8px 12px;">📱 تثبيت</button>
          <button class="btn" style="background: #455a64; color: white; padding: 8px 12px;" onclick="checkForUpdates()">🔄 تحديث</button>
          <button class="btn" style="background: #607d8b; color: white; padding: 8px 12px;" onclick="clearAll()">🗑 مسح</button>
        </div>
      </h2>
      <!--       <!-- باقي أقسام الواجهة -->
      <div class="card" style="background: #fff8e1; border: 2px dashed #ffb74d; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <strong style="color: #e65100; font-size: 15px;">🔢 نوع الأرقام:</strong>
        <select id="numeralStyle" style="max-width: 260px; font-weight: bold; background: #fff;">
          <option value="hindi" selected>هندية (٠١٢٣٤٥٦٧٨٩)</option>
          <option value="western">عربية (0123456789)</option>
        </select>
      </div>
      
      <div class="card">
        <h3>إعدادات الورقة والمادة</h3>
        <div class="grid">
          <div class="form-group"><label>حجم الورقة</label><select id="paperSize" onchange="onPaperSizeChange()"><option value="A4">A4 - ورقة كاملة</option><option value="A5">A5 - نصف ورقة</option></select></div>
          <div class="form-group"><label>تخصيص المادة</label><select id="subjectType" onchange="toggleMathToolbar()"><option value="arabic">عربي ومواد عامة</option><option value="english">اللغة الإنكليزية</option><option value="math">الرياضيات</option></select></div>
          <div class="form-group"><label>نمط الأسئلة</label><select id="paperMode" onchange="toggleAnswerFields()"><option value="standard">نمط اعتيادي</option><option value="table">نمط جدول</option></select></div>
          <div class="form-group"><label>حقول الجواب</label><select id="showAnswersMode" onchange="toggleAnswerFields()"><option value="auto">في الجدول فقط</option><option value="always">دائماً</option></select></div>
          <div class="form-group" style="grid-column: 1 / -1; background: #fff3e0; padding: 12px; border-radius: 6px; border: 1px dashed #ffb74d;">
            <label style="color: #d84315;">علامة مائية</label>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
              <select id="watermarkType" style="flex: 1;" onchange="toggleWatermarkInput()"><option value="text">نص</option><option value="image">صورة</option></select>
              <input type="text" id="watermarkText" placeholder="اكتب اسمك هنا..." style="flex: 2;">
              <input type="file" id="watermarkImage" accept="image/*" style="flex: 2; display: none; padding: 5px; background: #fff;">
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="border: 2px solid #1976d2;">
        <h3>🎨 تنسيق الورقة</h3>
        <div class="grid">
          <div class="form-group" style="grid-column: 1 / -1; background: #eef7ff; padding: 12px; border-radius: 8px; border: 1px dashed #64b5f6;">
            <label style="color: #0d47a1; margin-bottom: 8px;">✨ أنماط جاهزة</label>
            <div id="theme-gallery" class="theme-grid"></div>
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
              <button type="button" class="btn btn-primary" style="padding: 8px 14px; font-size: 13px;" onclick="autoThemeBySubject()">🎯 اقتراح تلقائي</button>
              <button type="button" class="btn" style="padding: 8px 14px; font-size: 13px; background: #e0e0e0; color: #333; border: 1px solid #ccc;" onclick="clearThemeSelection()">↺ تخصيص يدوي</button>
              <span id="themeHint" style="font-size: 12px; color: #37474f;"></span>
            </div>
          </div>
          <div class="form-group"><label>حجم الخط</label><select id="fontSize"><option value="14px">صغير</option><option value="16px" selected>متوسط</option><option value="18px">كبير</option><option value="20px">كبير جداً</option></select></div>
          <div class="form-group"><label>الفاصل</label><select id="dividerStyle"><option value="dashed" selected>خط متقطع</option><option value="solid">خط متصل</option><option value="dotted">نقاط</option><option value="stars">نجوم</option><option value="floral">زخرفة</option><option value="none">بدون</option></select></div>
          <div class="form-group" style="grid-column: 1 / -1; background: #f0f4f8; padding: 10px; border-radius: 6px;">
            <label>إطار الورقة</label>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <select id="borderStyle" style="flex: 2;"><option value="solid" selected>متصل</option><option value="double">مزدوج</option><option value="dashed">متقطع</option><option value="groove">مخدد</option><option value="ridge">بارز</option><option value="rounded">دائري</option><option value="none">بدون</option></select>
              <select id="borderWidth" style="flex: 1;"><option value="1px">1px</option><option value="2px">2px</option><option value="3px" selected>3px</option><option value="5px">5px</option><option value="8px">8px</option></select>
              <input type="color" id="borderColor" value="#000000" style="flex: 1; height: 38px; border: none;">
            </div>
          </div>
          <div class="form-group" style="grid-column: 1 / -1; display: flex; gap: 10px;">
            <div style="flex: 1;"><label>لون النص</label><input type="color" id="textColor" value="#000000" style="width: 100%; height: 38px; border: none;"></div>
            <div style="flex: 1;"><label>لون الخلفية</label><input type="color" id="bgColor" value="#ffffff" style="width: 100%; height: 38px; border: none;"></div>
            <div style="flex: 1;"><label>نقش الخلفية</label><select id="bgPattern"><option value="none" selected>بدون</option><option value="islamic1">إسلامي</option><option value="andalusi">أندلسي</option><option value="grid">شبكة</option><option value="dots">نقاط</option></select></div>
          </div>
          <div class="form-group" id="table-colors-group" style="display: none; grid-column: 1 / -1;">
            <label>ألوان الجدول</label>
            <div style="display: flex; gap: 10px;">
              <div style="flex: 1;"><span>السؤال</span><input type="color" id="qColor" value="#ffffff" style="width: 100%; height: 38px; border: none;"></div>
              <div style="flex: 1;"><span>الجواب</span><input type="color" id="aColor" value="#ffffff" style="width: 100%; height: 38px; border: none;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>بيانات الامتحان</h3>
        <div class="grid">
          <div class="form-group"><label>البسملة</label><select id="basmala"><option value="yes">نعم</option><option value="no">لا</option></select></div>
          <div class="form-group">
            <label>المديرية</label>
            <input type="checkbox" id="showDirectorate" checked> إظهارها
            <input type="text" id="directorate" placeholder="المديرية العامة...">
          </div>
          <div class="form-group"><label>المدرسة</label><input type="text" id="school" placeholder="مدرسة الأمل"></div>
          <div class="form-group"><label>نوع الامتحان</label><input type="text" id="examType" placeholder="امتحانات الشهر الأول"></div>
          <div class="form-group"><label>المادة</label><input type="text" id="subject" placeholder="العلوم"></div>
          <div class="form-group"><label>الصف</label><input type="text" id="grade" placeholder="الخامس الابتدائي"></div>
          <div class="form-group"><label>العام الدراسي</label><input type="text" id="year" placeholder="2026/2027"></div>
          <div class="form-group"><label>التاريخ (اختياري)</label><input type="text" id="examDate" placeholder="اتركه فارغاً"></div>
          <div class="form-group"><label>الوقت (اختياري)</label><input type="text" id="examTime" placeholder="اتركه فارغاً"></div>
          <div class="form-group"><label>اللقب</label><select id="teacherTitle"><option value="معلم المادة">معلم المادة</option><option value="معلمة المادة">معلمة المادة</option><option value="مدرس المادة">مدرس المادة</option><option value="مدرسة المادة">مدرسة المادة</option></select></div>
          <div class="form-group"><label>اسم الأستاذ</label><input type="text" id="teacherName" placeholder="الاسم والتوقيع"></div>
          <div class="form-group"><label>الملاحظة السفلية</label><input type="text" id="examNote" placeholder="تمنياتنا لكم بالنجاح"></div>
        </div>
      </div>

      <div class="card">
        <h3>الأسئلة</h3>
        <div id="math-toolbar" style="display: none; margin-bottom: 10px; background: #eee; padding: 10px; border-radius: 8px;">
          <div id="math-toolbar-rows"></div>
        </div>
        <div id="variant-tabs" style="display: none; margin-bottom: 10px; gap: 8px;">
          <button type="button" id="tab-a" class="variant-tab active" onclick="switchVariant('a')">📄 النموذج أ</button>
          <button type="button" id="tab-b" class="variant-tab" onclick="switchVariant('b')">📄 النموذج ب</button>
        </div>
        <div id="q-container-a" class="q-container"></div>
        <div id="q-container-b" class="q-container" style="display: none;"></div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn btn-primary" onclick="addQ()">➕ إضافة سؤال جديد</button>
          <button class="btn" style="background: #1565c0; color: #fff;" onclick="addSection()">📑 إضافة عنوان قسم</button>
        </div>
      </div>

      <div class="card" style="border: 2px solid #2e7d32; background: #f4fdf7;">
        <h3 style="color: #2e7d32;">📥 استخراج وحفظ الورقة</h3>
        <div style="margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 15px;">
          <strong>📄 نسخة الطلاب:</strong>
          <div class="actions-bar">
            <button class="btn btn-success" style="flex:1;" onclick="printPaper(false)">🖨 طباعة / PDF</button>
            <button class="btn btn-warning" style="flex:1;" onclick="saveImage(false)">🖼 حفظ كصورة</button>
          </div>
        </div>
        <div>
          <strong>📝 نسخة الأستاذ:</strong>
          <div class="actions-bar">
            <button class="btn btn-purple" style="flex:1;" onclick="printPaper(true)">🖨 طباعة / PDF</button>
            <button class="btn btn-warning" style="flex:1; background: #e67e22;" onclick="saveImage(true)">🖼 حفظ كصورة</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div id="paper-preview"></div>
  <div id="toast" class="toast">✓ تم الحفظ تلقائياً</div>
  <div id="updateBanner">
    🔄 يوجد تحديث جديد للتطبيق
    <button onclick="applyUpdate()">تحديث الآن</button>
  </div>

  <script>
    //     let count = 0;
    let currentVariant = 'a';
    let activeInput = null;
    let uploadedWatermarkImage = null;
    
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'inline-block'; });
    installBtn.addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') { installBtn.style.display = 'none'; } deferredPrompt = null; } });
    document.addEventListener('focusin', function(e) { if(e.target.tagName === 'TEXTAREA' || (e.target.tagName === 'INPUT' && e.target.type === 'text')) { activeInput = e.target; } });

    function toggleWatermarkInput() {
        let type = document.getElementById('watermarkType').value;
        if(type === 'text') { document.getElementById('watermarkText').style.display = 'block'; document.getElementById('watermarkImage').style.display = 'none'; uploadedWatermarkImage = null; }
        else { document.getElementById('watermarkText').style.display = 'none'; document.getElementById('watermarkImage').style.display = 'block'; }
        scheduleSave();
    }

    function compressImage(dataUrl, maxSide, done) {
        let img = new Image();
        img.onload = function() {
            let w = img.width, h = img.height;
            let scale = Math.min(1, maxSide / Math.max(w, h));
            if (scale >= 1 && dataUrl.length < 300000) { done(dataUrl); return; }
            w = Math.round(w * scale); h = Math.round(h * scale);
            let canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            let isPng = /^data:image\/png/i.test(dataUrl);
            done(canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', 0.85));
        };
        img.onerror = function() { done(dataUrl); };
        img.src = dataUrl;
    }

    document.getElementById('watermarkImage').addEventListener('change', function(e) {
        let file = e.target.files[0];
        if(file) { let reader = new FileReader(); reader.onload = function(event) { compressImage(event.target.result, 900, function(finalUrl) { uploadedWatermarkImage = finalUrl; scheduleSave(); }); }; reader.readAsDataURL(file); }
    });

    const MATH_SYMBOLS = [
      { label: 'العمليات', items: ['+', '−', '×', '÷', '=', '≠'] }, { label: 'المقارنة', items: ['<', '>', '≤', '≥', '≈'] },
      { label: 'الكسور', items: ['½', '⅓', '¼', '⅔', '¾'] }, { label: 'الأُسس', items: ['²', '³', '⁴', '⁵', '⁶'] },
      { label: 'الجذور', items: ['√', '∛'] }, { label: 'الهندسة', items: ['∠', '°', '∟', '△', '□', '○', 'π'] },
      { label: 'أخرى', items: ['%', ')', '(', '٫'] }, { label: 'الأرقام', items: ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'] }
    ];

    function buildMathToolbar() {
      const host = document.getElementById('math-toolbar-rows'); if (!host) return; host.innerHTML = '';
      MATH_SYMBOLS.forEach(function(group) {
        const row = document.createElement('div'); row.style.cssText = 'display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 4px;';
        const lbl = document.createElement('strong'); lbl.textContent = group.label + ':'; lbl.style.cssText = 'font-size: 12px; min-width: 72px; color: #455a64;'; row.appendChild(lbl);
        group.items.forEach(function(sym) {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'toolbar-btn'; b.textContent = sym; b.style.cssText = 'min-width: 30px; font-size: 14px; padding: 4px 6px;';
          b.addEventListener('mousedown', function(e) { e.preventDefault(); }); b.addEventListener('click', function() { insertSymGlobal(sym); }); row.appendChild(b);
        });
        host.appendChild(row);
      });
    }

    function toggleMathToolbar() { let type = document.getElementById('subjectType').value; document.getElementById('math-toolbar').style.display = (type === 'math') ? 'block' : 'none'; }
    function toggleAnswerFields() {
      let mode = document.getElementById('paperMode').value; let showMode = document.getElementById('showAnswersMode').value;
      document.querySelectorAll('.q-answer, .b-answer').forEach(field => { if(showMode === 'always' || mode === 'table') { field.style.display = 'block'; } else { field.style.display = 'none'; } });
      document.getElementById('table-colors-group').style.display = (mode === 'table') ? 'block' : 'none';
    }

    function activeQContainer() { return document.getElementById('q-container-' + currentVariant); }
    function switchVariant(v) {
      currentVariant = (v === 'b') ? 'b' : 'a';
      document.getElementById('q-container-a').style.display = (currentVariant === 'a') ? 'block' : 'none';
      document.getElementById('q-container-b').style.display = (currentVariant === 'b') ? 'block' : 'none';
      document.getElementById('tab-a').classList.toggle('active', currentVariant === 'a');
      document.getElementById('tab-b').classList.toggle('active', currentVariant === 'b');
    }
    function applyVariantUI() {
      const isA5 = document.getElementById('paperSize').value === 'A5'; document.getElementById('variant-tabs').style.display = isA5 ? 'flex' : 'none';
      if (!isA5) currentVariant = 'a'; switchVariant(currentVariant);
    }
    function onPaperSizeChange() {
      if (document.getElementById('paperSize').value === 'A5') { const b = document.getElementById('q-container-b'); if (b.querySelectorAll('.question-block').length === 0) addQ(b); }
      applyVariantUI(); scheduleSave();
    }

    function addSection(container) {
      const qc = container || activeQContainer(); const div = document.createElement('div');
      div.className = 'section-block'; div.style.cssText = 'border: 2px dashed #90caf9; background: #e3f2fd; border-radius: 8px; padding: 10px; margin-bottom: 12px;';
      div.innerHTML = "<div style='display: flex; gap: 6px; align-items: center; flex-wrap: wrap;'><strong style='color: #1565c0;'>📑 عنوان قسم</strong><input type='text' class='s-title' placeholder='مثلاً: القرآن الكريم' style='flex: 1; padding: 6px;'><input type='text' class='s-marks' placeholder='الدرجة' style='width: 90px; padding: 6px;'><input type='color' class='s-color' value='#1565c0' style='width: 42px; height: 34px;'><button type='button' class='btn btn-danger' onclick='deleteSection(this)'>حذف</button></div>";
      qc.appendChild(div); scheduleSave(); return div;
    }
    function deleteSection(btn) { const sec = btn.closest('.section-block'); if (sec) sec.remove(); scheduleSave(); }

    function addQ(target) {
      const qc = target || activeQContainer(); count = qc.querySelectorAll('.question-block').length + 1;

    function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function processMathSymbols(text) {
